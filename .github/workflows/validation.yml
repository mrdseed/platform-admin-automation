name: Terraform Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "security/**"
      - "ansible/**"
      - ".github/workflows/validation.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "security/**"
      - "ansible/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.6.0"
  TOFU_VERSION: "1.6.2"
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Terraform fmt
        run: tofu fmt -check -recursive -diff terraform/

  validate-modules:
    name: Validate — ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        module:
          - resource-group
          - virtual-network
          - subnet
          - network-security-group
          - route-table
          - storage-account
          - key-vault
          - linux-vm
          - managed-identity
          - role-assignment
          - private-endpoint
          - log-analytics-workspace
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Init and Validate
        working-directory: terraform/modules/${{ matrix.module }}
        run: |
          tofu init -backend=false
          tofu validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform

      - name: Run TFLint
        run: tflint -f compact --recursive
        working-directory: terraform

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-terraform

  validate-environments:
    name: Validate Environment — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: validate-modules
    strategy:
      matrix:
        environment: [dev, qa, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Init and Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          tofu init -backend=false
          tofu validate

  security-governance:
    name: Security Governance Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject public IP in workload modules
        run: |
          if grep -r 'azurerm_public_ip' terraform/modules/linux-vm terraform/environments/ 2>/dev/null; then
            echo "azurerm_public_ip found in workload paths — violates no-public-IP standard"
            exit 1
          fi
          echo "No public IP resources in workload modules"

      - name: Install yq
        run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq

      - name: Validate access catalog
        run: |
          yq eval '.apiVersion' security/access-management/users-groups.yml | grep -q 'platform.example/v1'
          for role in Owner Contributor "User Access Administrator"; do
            if yq eval ".role_assignments[] | select(.role == \"$role\")" security/access-management/users-groups.yml | grep -q .; then
              echo "Denied role in catalog: $role"
              exit 1
            fi
          done

      - name: Validate custom RBAC JSON
        run: |
          for f in security/custom-rbac/deployment-sp-*.json; do
            python3 -c "import json; json.load(open('$f'))"
            echo "Valid: $f"
          done

      - name: Ansible playbook syntax check
        run: |
          pip install ansible-core --quiet
          cd ansible
          for pb in playbooks/*.yml; do
            ansible-playbook "$pb" --syntax-check
          done

  plan-dev:
    name: Plan — Dev (OIDC)
    runs-on: ubuntu-latest
    needs: [validate-environments, checkov, security-governance]
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        env:
          TF_VAR_admin_ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7ci-validation-only-not-for-access"
        run: |
          tofu init
          tofu plan -var-file=terraform.tfvars.example -input=false -no-color -out=tfplan 2>&1 | tee plan.txt || true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('terraform/environments/dev/plan.txt')
              ? fs.readFileSync('terraform/environments/dev/plan.txt', 'utf8')
              : 'Plan step skipped or unavailable.';
            const body = `#### OpenTofu Plan — \`dev\`\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
