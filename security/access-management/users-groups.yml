# Access Management — Source of Truth

This file defines Entra ID groups, membership rules, and Azure RBAC assignments enforced by the access-sync pipeline.

# Schema version for pipeline validation
apiVersion: platform.example/v1
kind: AccessCatalog
metadata:
  name: platform-access-catalog
  owner: platform-team@example.com

groups:
  - name: grp-platform-admins
    description: Platform engineers with full landing zone deploy rights (non-prod)
    entra_object_id: "00000000-0000-0000-0000-000000000010"
    members:
      - user: alice.admin@example.com
      - user: bob.admin@example.com

  - name: grp-platform-readers
    description: Read-only visibility across platform subscriptions
    entra_object_id: "00000000-0000-0000-0000-000000000011"
    members:
      - group: grp-security-audit

  - name: grp-security-audit
    description: Security team — audit and compliance review
    entra_object_id: "00000000-0000-0000-0000-000000000012"
    members:
      - user: audit.lead@example.com

  - name: grp-app-prod-operators
    description: Application team operators — prod resource group scoped
    entra_object_id: "00000000-0000-0000-0000-000000000013"
    members:
      - user: app.owner@example.com

service_principals:
  - name: sp-platform-tf-dev
    object_id: "00000000-0000-0000-0000-000000000020"
    roles:
      - role: PlatformDeploy-Network
        scope: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg-platform-shared-dev-eus2-001
      - role: PlatformDeploy-Compute
        scope: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg-platform-shared-dev-eus2-001
      - role: PlatformDeploy-KeyVault
        scope: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg-platform-shared-dev-eus2-001

  - name: sp-platform-tf-prod
    object_id: "00000000-0000-0000-0000-000000000021"
    roles:
      - role: PlatformDeploy-Network
        scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-shared-prod-eus2-001
      - role: PlatformDeploy-Compute
        scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-shared-prod-eus2-001
      - role: PlatformDeploy-KeyVault
        scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-shared-prod-eus2-001
      - role: PlatformDeploy-Storage
        scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-sftp-prod-eus2-001
      - role: PlatformDeploy-Monitoring
        scope: /subscriptions/00000000-0000-0000-0000-000000000004

role_assignments:
  - principal: grp-platform-admins
    principal_type: Group
    role: Reader
    scope: /subscriptions/00000000-0000-0000-0000-000000000001

  - principal: grp-platform-readers
    principal_type: Group
    role: Reader
    scope: /subscriptions/00000000-0000-0000-0000-000000000004

  - principal: grp-security-audit
    principal_type: Group
    role: Key Vault Reader
    scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-shared-prod-eus2-001/providers/Microsoft.KeyVault/vaults/kv-platform-prod-eus2-001

  - principal: grp-app-prod-operators
    principal_type: Group
    role: Virtual Machine User Login
    scope: /subscriptions/00000000-0000-0000-0000-000000000004/resourceGroups/rg-platform-shared-prod-eus2-001

# Explicit deny patterns — pipeline validates these are never assigned
denied_roles:
  - Owner
  - Contributor
  - User Access Administrator

# Exceptions require ticket reference and expiration
exceptions: []
